apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ops-agent
  namespace: ai-agent-demo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-ops-agent
  namespace: ai-agent-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # This is deliberately constrained to the one demo deployment that the agent may restart.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["nginx-good"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-ops-agent
  namespace: ai-agent-demo
subjects:
  - kind: ServiceAccount
    name: k8s-ops-agent
    namespace: ai-agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-ops-agent
