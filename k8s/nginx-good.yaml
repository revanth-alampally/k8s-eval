# Baseline healthy workload. The agent should report this as Running and Ready, and
# it is the control case for "are any pods unhealthy?" -- if this ever shows up in an
# unhealthy list, the agent's health logic is wrong.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-good
  labels:
    app: nginx-good
    app.kubernetes.io/part-of: ai-agent-demo
    demo.scenario: healthy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-good
  template:
    metadata:
      labels:
        app: nginx-good
        app.kubernetes.io/part-of: ai-agent-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-good
  labels:
    app: nginx-good
    app.kubernetes.io/part-of: ai-agent-demo
spec:
  selector:
    app: nginx-good
  ports:
    - name: http
      port: 80
      targetPort: http
