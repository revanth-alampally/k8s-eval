apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ops-agent
  namespace: ai-agent-demo
  labels:
    app.kubernetes.io/name: k8s-ops-agent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-ops-agent
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: k8s-ops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: k8s-ops-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KAGENT_ENVIRONMENT
              value: kind
            - name: KAGENT_LOG_FORMAT
              value: json
            - name: KAGENT_ALLOWED_NAMESPACES
              value: ai-agent-demo
            - name: KAGENT_LLM_PROVIDER
              value: fake
            # An image does not contain a persisted Chroma index; enable it after
            # mounting or otherwise provisioning a corpus and index volume.
            - name: KAGENT_RAG_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
