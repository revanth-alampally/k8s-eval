# Crash scenario: a real nginx image handed a config file it cannot parse, so the
# process exits immediately and the pod settles into CrashLoopBackOff.
#
# This is deliberately more interesting than `exit 1`: the answer to "why is this pod
# failing?" is only in the container logs, not in the pod status or events. A correct
# agent has to call get_pod_logs (with previous=true, since the container is not
# currently running) to find the nginx [emerg] line.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-crash-config
  labels:
    app: nginx-crash
    app.kubernetes.io/part-of: ai-agent-demo
data:
  nginx.conf: |
    events {}
    http {
        server {
            listen 80;
            # Not a real nginx directive: nginx fails config validation on startup
            # with "unknown directive" and exits non-zero.
            enable_turbo_mode on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-crash
  labels:
    app: nginx-crash
    app.kubernetes.io/part-of: ai-agent-demo
    demo.scenario: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-crash
  template:
    metadata:
      labels:
        app: nginx-crash
        app.kubernetes.io/part-of: ai-agent-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: nginx-crash-config
